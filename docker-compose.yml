services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: ai-gateway-api
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./config:/app/config:ro
    environment:
      - TZ=Asia/Shanghai
      - GATEWAY_CONFIG=/app/config/config.yaml
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
      - GATEWAY_ENCRYPTION_KEY=${GATEWAY_ENCRYPTION_KEY}
      - GATEWAY_PREVIOUS_ENCRYPTION_KEY=${GATEWAY_PREVIOUS_ENCRYPTION_KEY:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-localhost}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-aigateway}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-aigateway}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
    container_name: ai-gateway-portal
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8081
      - STATIC_ROOT=/app/web/portal
      - ROUTE_BASE=/
      - API_ORIGIN=http://127.0.0.1:8080
    depends_on:
      gateway:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: ai-gateway-admin
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8082
      - STATIC_ROOT=/app/web/admin
      - ROUTE_BASE=/admin
      - API_ORIGIN=http://127.0.0.1:8080
    depends_on:
      gateway:
        condition: service_started

  # ── Observability ────────────────────────────────────────────
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: ai-gateway-jaeger
    restart: unless-stopped
    network_mode: host

  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--port", "16379", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
