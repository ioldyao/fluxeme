# Observability: set OTLP_ENDPOINT in .env to enable distributed tracing.
# e.g.  OTLP_ENDPOINT=http://localhost:4317  (gRPC, OTel Collector or Jaeger)
# Tracing is disabled when the variable is empty or unset.

server:
  host: 0.0.0.0
  port: 8080
database:
  pg_url: ""
  retention_days: 90
  clickhouse:
    host: ${CLICKHOUSE_HOST:-localhost}
    port: ${CLICKHOUSE_PORT:-8123}
    user: ${CLICKHOUSE_USER:-default}
    password: ${CLICKHOUSE_PASSWORD:-}
    db: ${CLICKHOUSE_DB:-aigateway}
jwt_secret: ${GATEWAY_JWT_SECRET}
encryption_key: ${GATEWAY_ENCRYPTION_KEY}
previous_encryption_key: ${GATEWAY_PREVIOUS_ENCRYPTION_KEY}

# Redis (cache, gate status, billing backlog, obs event stream)
redis:
  enabled: true
  url: "redis://:${REDIS_PASSWORD}@127.0.0.1:16379"

