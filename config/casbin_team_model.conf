# Team-scoped RBAC model with a domain (team) dimension.
# Unlike the global admin model (casbin_model.conf), requests here are
# (subject, domain, object) where domain is the team_id.
[request_definition]
r = sub, dom, obj

[policy_definition]
p = sub, dom, obj

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch(r.obj, p.obj)
