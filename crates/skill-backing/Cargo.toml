[package]
name = "fluxeme-skill-backing"
version = "0.1.0"
edition = "2021"
description = "Skill Runtime / Backing 数据面子系统：部署 / 鉴权 / 路由 / 代理 / 计量（独立自洽，只依赖 fluxeme-contract）"

[dependencies]
fluxeme-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "net", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream", "http2"] }
axum = { version = "0.8" }
url = "2"
async-trait = "0.1"
tracing = "0.1"
sqlx-core = { version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "0.8", features = ["chrono", "uuid"] }
